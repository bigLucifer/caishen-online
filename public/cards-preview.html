<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财神大战 · 卡牌陈列</title>
<style>
  body { margin: 0; padding: 30px 20px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at top, #f7ecd0, #e6d4a8); color: #2b1a0e; min-height: 100vh; }
  h1 { text-align: center; color: #8a6a1e; letter-spacing: 6px; margin: 0 0 8px; }
  h2 { color: #8a6a1e; margin: 24px 0 12px; letter-spacing: 3px; text-align: center; }
  .board { max-width: 900px; margin: 0 auto; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }

  .card {
    position: relative; display: inline-block;
    width: 100px; height: 148px; border-radius: 12px;
    background: #fdfaf0;
    box-shadow: 0 3px 10px rgba(0,0,0,.25), inset 0 0 0 2px rgba(255,255,255,.6);
    overflow: hidden; border: 1.5px solid rgba(0,0,0,.15);
    transition: transform .12s ease;
  }
  .card:hover { transform: translateY(-4px); }
  .card.faction-qinglong  { --fc: #2f7a3a; --fbg: #eaf5eb; --fbg2: #d5eadb; }
  .card.faction-baihu     { --fc: #a67c15; --fbg: #fff5d6; --fbg2: #f3e2a8; }
  .card.faction-zhuque    { --fc: #c23a2f; --fbg: #ffece8; --fbg2: #f8cec5; }
  .card.faction-xuanwu    { --fc: #2a4b8d; --fbg: #e8effa; --fbg2: #c8d6ef; }
  .card.special-caishen   { --fc: #8a6a1e; --fbg: #fff8d0; --fbg2: #f5d97c; }
  .card.special-qionggui  { --fc: #5a5045; --fbg: #e6e0d3; --fbg2: #c9bfa8; }
  .card.faction-qinglong, .card.faction-baihu, .card.faction-zhuque, .card.faction-xuanwu,
  .card.special-caishen, .card.special-qionggui {
    background: linear-gradient(160deg, var(--fbg) 0%, #fdfaf0 55%, var(--fbg2) 100%);
    box-shadow: 0 3px 10px rgba(0,0,0,.22), inset 0 0 0 2px rgba(255,255,255,.7), inset 0 -30px 40px -20px var(--fbg2);
    border-color: var(--fc);
  }
  .card.back {
    background: radial-gradient(ellipse at center, #a02620 0 40%, #6a1410 100%);
    border-color: #4a0f0b;
    box-shadow: 0 3px 10px rgba(0,0,0,.35), inset 0 0 0 2px #d9c26e, inset 0 0 0 4px #4a0f0b;
  }
  .card.back svg { fill: #d9c26e; }
  .card svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="board">
  <h1>财神大战 · 卡牌陈列</h1>
  <p style="text-align:center; color:#8a6a4a;">60 张牌全预览 · 悬停可上浮</p>

  <h2>特殊牌 · 财神 × 4</h2>
  <div class="row" id="row-caishen"></div>

  <h2>青龙 · 1-13</h2>
  <div class="row" id="row-qinglong"></div>

  <h2>白虎 · 1-13</h2>
  <div class="row" id="row-baihu"></div>

  <h2>朱雀 · 1-13</h2>
  <div class="row" id="row-zhuque"></div>

  <h2>玄武 · 1-13</h2>
  <div class="row" id="row-xuanwu"></div>

  <h2>特殊牌 · 穷鬼 × 4</h2>
  <div class="row" id="row-qionggui"></div>

  <h2>牌背</h2>
  <div class="row" id="row-back"></div>
</div>

<script>
const TOTEMS = {
  qinglong: `<path d="M20 55 Q35 30 50 45 T80 40 Q70 55 55 55 T20 55 Z M62 32 a4 4 0 1 1 0.1 0 M22 62 Q40 68 60 62 M18 68 Q35 74 62 68" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="62" cy="32" r="2.2" fill="currentColor"/>`,
  baihu: `<path d="M28 32 Q40 22 52 32 L58 30 L60 36 L70 34 L64 42 Q60 55 50 58 Q40 55 36 42 L30 34 L32 30 Z M42 44 a2 2 0 1 1 0.1 0 M56 44 a2 2 0 1 1 0.1 0 M46 52 L52 52 M40 26 L38 20 M60 26 L62 20" fill="currentColor" opacity=".95" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M22 62 Q34 68 50 66 T78 62 M25 70 Q40 74 55 72" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>`,
  zhuque: `<path d="M50 20 Q35 30 30 50 Q35 65 50 70 Q65 65 70 50 Q65 30 50 20 Z M50 24 Q45 34 43 46 Q45 58 50 66 Q55 58 57 46 Q55 34 50 24 Z M30 50 Q22 46 15 52 Q25 55 32 54 M70 50 Q78 46 85 52 Q75 55 68 54 M42 40 L38 32 M58 40 L62 32" fill="currentColor" opacity=".9" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><circle cx="46" cy="34" r="1.5" fill="#fff"/>`,
  xuanwu: `<ellipse cx="50" cy="52" rx="26" ry="18" fill="currentColor" opacity=".85"/><path d="M50 34 L38 42 L38 62 L50 70 L62 62 L62 42 Z" fill="none" stroke="#fff" stroke-width="1.2"/><path d="M50 34 L50 70 M38 42 L62 62 M62 42 L38 62 M32 52 Q22 44 20 30 Q30 34 34 44 M68 52 Q78 44 80 30 Q70 34 66 44 M42 72 L38 82 M58 72 L62 82 M28 62 L20 68" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>`,
  caishen: `<circle cx="50" cy="50" r="22" fill="currentColor" opacity=".2"/><path d="M50 28 L52 42 L66 44 L56 54 L60 68 L50 60 L40 68 L44 54 L34 44 L48 42 Z" fill="currentColor"/><text x="50" y="56" text-anchor="middle" font-size="18" font-weight="900" fill="#fff8d0" font-family="serif">财</text><circle cx="30" cy="30" r="2" fill="currentColor"/><circle cx="70" cy="30" r="2" fill="currentColor"/><circle cx="30" cy="70" r="2" fill="currentColor"/><circle cx="70" cy="70" r="2" fill="currentColor"/>`,
  qionggui: `<path d="M35 40 Q35 32 42 30 L58 30 Q65 32 65 40 L65 55 Q65 60 60 62 L50 66 L40 62 Q35 60 35 55 Z M42 42 a2 2 0 1 1 0.1 0 M58 42 a2 2 0 1 1 0.1 0 M44 54 Q50 50 56 54" fill="currentColor" opacity=".8" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M40 68 L38 80 M60 68 L62 80 M50 66 L50 80" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="50" y="90" text-anchor="middle" font-size="10" fill="currentColor" font-weight="700">空</text>`,
};
const FACTION_LABEL = { qinglong: '青龙', baihu: '白虎', zhuque: '朱雀', xuanwu: '玄武' };
const NUM_LEVEL = ['士','士','士','士','士','将','将','将','侯','侯','王','王','帝'];
const IDIOMS = {
  qinglong: ['潜龙勿用','见龙在田','龙蛇起陆','鱼跃龙门','云蒸龙变','龙腾虎跃','生龙活虎','游龙戏凤','龙飞凤舞','龙翔九天','真龙天子','龙盘虎踞','飞龙在天'],
  baihu:    ['初生牛犊','虎虎生风','如虎添翼','卧虎藏龙','虎啸山林','龙争虎斗','气吞万虎','虎踞龙盘','猛虎下山','虎视眈眈','虎步生风','虎啸风生','百兽之王'],
  zhuque:   ['雀跃三尺','一飞冲天','鸿鹄之志','鸾翔凤集','百鸟争鸣','凤鸣朝阳','莺歌燕舞','孔雀开屏','鸾凤和鸣','凤翥龙翔','丹凤朝阳','百鸟朝凤','凤凰涅槃'],
  xuanwu:   ['龟毛兔角','灵龟负图','稳如泰山','固若金汤','深藏若虚','玄机暗藏','沉潜蓄势','玄天玉宇','龟鹤延年','玄之又玄','玄冥有主','斗转星移','玄武当空'],
};
const SPECIAL_IDIOM = { caishen: '财源广进', qionggui: '囊空如洗' };

function normalCard(faction, n) {
  const f = FACTION_LABEL[faction];
  const level = NUM_LEVEL[n-1];
  const idiom = IDIOMS[faction][n-1];
  const isBig = n >= 11;
  return `<div class="card faction-${faction}">
    <svg viewBox="0 0 100 150" style="color: var(--fc);">
      <text x="10" y="26" font-size="22" font-weight="900" fill="currentColor" font-family="serif">${n}</text>
      <text x="10" y="40" font-size="12" font-weight="700" fill="currentColor" opacity=".85">${f.substr(0,1)}</text>
      <text x="90" y="140" font-size="22" font-weight="900" fill="currentColor" font-family="serif" text-anchor="end" transform="rotate(180 90 140)">${n}</text>
      <text x="90" y="126" font-size="12" font-weight="700" fill="currentColor" opacity=".85" text-anchor="end" transform="rotate(180 90 126)">${f.substr(0,1)}</text>
      <g transform="translate(0 20) scale(${isBig?1.05:0.9}) translate(0 ${isBig?-3:5})">${TOTEMS[faction]}</g>
      ${n >= 8 ? `
        <text x="50" y="106" text-anchor="middle" font-size="9" font-weight="600" fill="currentColor" opacity=".65">${level}</text>
        <text x="50" y="126" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" letter-spacing="1.5">${idiom}</text>
      ` : `
        <text x="50" y="124" text-anchor="middle" font-size="10" font-weight="600" fill="currentColor" opacity=".7" letter-spacing="1.5">${idiom}</text>
      `}
      <rect x="6" y="6" width="88" height="138" rx="5" fill="none" stroke="currentColor" stroke-width=".8" opacity=".4"/>
      ${n === 13 ? `<circle cx="15" cy="145" r="3" fill="currentColor" opacity=".6"/><circle cx="85" cy="5" r="3" fill="currentColor" opacity=".6"/>` : ''}
    </svg>
  </div>`;
}
function caishenCard() {
  return `<div class="card special-caishen"><svg viewBox="0 0 100 150" style="color: var(--fc);">
    <text x="10" y="26" font-size="20" font-weight="800" fill="currentColor" font-family="serif">财</text>
    <text x="90" y="140" font-size="20" font-weight="800" fill="currentColor" font-family="serif" text-anchor="end" transform="rotate(180 90 140)">财</text>
    <g transform="translate(0 20)">${TOTEMS.caishen}</g>
    <text x="50" y="126" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" letter-spacing="2">${SPECIAL_IDIOM.caishen}</text>
    <rect x="6" y="6" width="88" height="138" rx="5" fill="none" stroke="currentColor" stroke-width=".8" opacity=".5"/>
  </svg></div>`;
}
function qiongguiCard() {
  return `<div class="card special-qionggui"><svg viewBox="0 0 100 150" style="color: var(--fc);">
    <text x="10" y="26" font-size="20" font-weight="800" fill="currentColor" font-family="serif">穷</text>
    <text x="90" y="140" font-size="20" font-weight="800" fill="currentColor" font-family="serif" text-anchor="end" transform="rotate(180 90 140)">穷</text>
    <g transform="translate(0 20)">${TOTEMS.qionggui}</g>
    <text x="50" y="126" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" letter-spacing="2">${SPECIAL_IDIOM.qionggui}</text>
    <rect x="6" y="6" width="88" height="138" rx="5" fill="none" stroke="currentColor" stroke-width=".8" opacity=".5" stroke-dasharray="3 2"/>
  </svg></div>`;
}
function backCard() {
  return `<div class="card back"><svg viewBox="0 0 100 150">
    <text x="50" y="90" text-anchor="middle" font-size="60" font-weight="900" font-family="serif">财</text>
    <rect x="8" y="8" width="84" height="134" rx="6" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="50" cy="30" r="4" fill="currentColor"/><circle cx="50" cy="120" r="4" fill="currentColor"/>
  </svg></div>`;
}
['qinglong','baihu','zhuque','xuanwu'].forEach(f => {
  const rowEl = document.getElementById('row-'+f);
  for (let n=1; n<=13; n++) rowEl.innerHTML += normalCard(f, n);
});
for (let i=0; i<4; i++) document.getElementById('row-caishen').innerHTML += caishenCard();
for (let i=0; i<4; i++) document.getElementById('row-qionggui').innerHTML += qiongguiCard();
for (let i=0; i<3; i++) document.getElementById('row-back').innerHTML += backCard();
</script>
</body>
</html>
