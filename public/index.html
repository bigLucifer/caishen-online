<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="财神大战">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8a1c15">
<meta name="format-detection" content="telephone=no,email=no,adress=no">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%238a1c15'/%3E%3Ctext x='90' y='120' font-size='110' text-anchor='middle' fill='%23f5d97c' font-family='serif' font-weight='bold'%3E财%3C/text%3E%3C/svg%3E">
<title>财神大战 · 联机对战</title>
<style>
  :root {
    --bg: #f4ecd8;
    --paper: #fbf7ea;
    --ink: #2b1a0e;
    --gold: #c9a24a;
    --gold-deep: #8a6a1e;
    --red: #c23a2f;
    --green: #2f7a3a;
    --blue: #2a4b8d;
    --yellow: #d9a521;
    --shadow: 0 4px 14px rgba(0,0,0,.15);
    --radius: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at top, #f7ecd0 0%, #e6d4a8 100%);
    color: var(--ink); overflow-x: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-overflow-scrolling: touch; touch-action: manipulation;
  }
  input, textarea { -webkit-user-select: text; user-select: text; }
  #app {
    max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
    padding: max(10px, env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    position: relative;
  }
  h1,h2,h3 { margin: 0; font-weight: 600; }
  button {
    font-family: inherit; border: 1px solid var(--gold-deep);
    background: linear-gradient(180deg, #f8dc8a 0%, #d9a521 100%);
    color: var(--ink); padding: 12px 20px; min-height: 44px;
    border-radius: var(--radius); font-size: 15px; cursor: pointer;
    box-shadow: var(--shadow); font-weight: 600;
    -webkit-appearance: none; appearance: none;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:active { transform: scale(.96); }
  button.ghost { background: var(--paper); color: var(--gold-deep); }
  button.danger { background: linear-gradient(180deg, #e77066 0%, #b22e24 100%); color:#fff; border-color:#7a1f18; }
  input[type="text"], input[type="number"] {
    padding: 12px 14px; border-radius: 8px; border: 1px solid #ccb884;
    background: #fff; font-size: 16px; font-family: inherit; flex: 1; min-width: 0;
    text-align: center; letter-spacing: 2px;
  }
  .card-header { text-align: center; padding: 18px 0 10px; }
  .card-header .title { font-size: 32px; letter-spacing: 8px; color: var(--gold-deep); text-shadow: 0 2px 0 rgba(255,255,255,.6); }
  .card-header .slogan { font-size: 13px; color: #8a6a4a; margin-top: 6px; letter-spacing: 4px; }
  .panel { background: var(--paper); border: 1px solid #d4bf8c; border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .panel h3 { color: var(--gold-deep); margin-bottom: 10px; font-size: 16px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }

  /* 卡牌 */
  .card {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: space-between;
    width: 62px; height: 92px; background: #fff; border: 2px solid #333; border-radius: 8px;
    padding: 6px 4px; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,.2);
    position: relative; flex-shrink: 0; transition: transform .12s ease;
  }
  .card.small { width: 50px; height: 74px; font-size: 12px; padding: 4px 2px; }
  .card.faction-qinglong  { border-color: var(--green);  color: var(--green); }
  .card.faction-baihu     { border-color: var(--yellow); color: #a67c15; }
  .card.faction-zhuque    { border-color: var(--red);    color: var(--red); }
  .card.faction-xuanwu    { border-color: var(--blue);   color: var(--blue); }
  .card.special-caishen   { border-color: var(--gold-deep); background: linear-gradient(135deg,#fff8d0,#f5d97c); color: var(--gold-deep); }
  .card.special-qionggui  { border-color: #6a6055; background: #d8d0c2; color: #4a4238; }
  .card.disabled { opacity: .35; filter: grayscale(.6); }
  .card.selectable { cursor: pointer; }
  .card.selectable:active { transform: translateY(-6px) scale(1.05); box-shadow: 0 6px 12px rgba(0,0,0,.3); }
  .card .num { font-size: 22px; line-height: 1; }
  .card.small .num { font-size: 17px; }
  .card .faction { font-size: 12px; letter-spacing: 1px; }
  .card.small .faction { font-size: 11px; }
  .card .icon { font-size: 20px; }
  .card.small .icon { font-size: 16px; }
  .card.back { background: repeating-linear-gradient(45deg, #8a1c15 0 8px, #6a1410 8px 16px); color:#d9c26e; border-color:#4a0f0b; justify-content:center; align-items:center; }
  .card.back::before { content: "财"; font-size: 30px; color: #d9c26e; }

  /* 对战 */
  .top-bar { display:flex; justify-content:space-between; align-items:center; padding:10px 12px;
    background: linear-gradient(180deg, #8a1c15 0%, #5a0f0b 100%); color:#f5d97c; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 10px; }
  .top-bar .round-info { font-size: 13px; letter-spacing: 1px; }
  .top-bar .trump-info { font-size: 12px; }
  .top-bar .code-info { font-size: 11px; opacity: .85; }
  .trump-badge { display:inline-block; padding: 2px 8px; border-radius: 4px; background:#fff; color:#333; font-weight:600; margin-left:4px; }
  .player-list { display:grid; grid-template-columns:1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .player-card { background: var(--paper); border:1px solid #d4bf8c; border-radius: 8px; padding: 8px; font-size: 12px; }
  .player-card.active { border-color: var(--gold-deep); box-shadow: 0 0 0 2px rgba(201,162,74,.4); background:#fff8e0; }
  .player-card.you { background: linear-gradient(180deg,#fff8e0,#f5e6bd); }
  .player-card.offline { opacity: .6; }
  .player-card .name { font-weight: 600; font-size: 14px; }
  .player-card .stats { color: #7a5c1f; margin-top: 2px; }
  .tag-dealer, .tag-lead, .tag-host, .tag-off {
    display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 3px;
    margin-left: 3px; vertical-align: middle; font-weight: 600; letter-spacing: 1px;
  }
  .tag-dealer { background: #d9c26e; color: #5a3f0a; }
  .tag-lead   { background: var(--red); color: #fff; }
  .tag-host   { background: var(--blue); color: #fff; }
  .tag-off    { background: #999; color: #fff; }

  .trick-area { background: rgba(255,255,255,.6); border: 2px dashed var(--gold-deep); border-radius: var(--radius); padding: 12px; min-height: 110px; display:flex; gap:6px; flex-wrap:wrap; justify-content:center; align-items:center; margin-bottom: 10px; }
  .trick-area .empty { color: #a89268; font-size: 13px; }
  .trick-play { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .trick-play .who { font-size: 11px; color: var(--gold-deep); font-weight: 600; }
  .trick-play .lead-mark { font-size: 10px; color: var(--red); font-weight:600; background:#fff; padding:0 4px; border-radius:3px; border:1px solid var(--red); }

  .hand-area { background: var(--paper); border:1px solid #d4bf8c; border-radius: var(--radius); padding: 10px 8px; margin-bottom: 10px; }
  .hand-area .hand-title { font-size: 12px; color: var(--gold-deep); margin-bottom: 8px; letter-spacing: 1px; display:flex; justify-content:space-between; }
  .hand-cards { display:flex; gap: 6px; justify-content:flex-start; overflow-x:auto; overflow-y:hidden; padding: 4px 2px 8px; -webkit-overflow-scrolling: touch; }
  .hand-cards::-webkit-scrollbar { height: 4px; }
  .hand-cards::-webkit-scrollbar-thumb { background: rgba(138,106,30,.3); border-radius: 2px; }

  .action-bar { position: sticky; bottom: calc(8px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(251,247,234,.95), rgba(251,247,234,1));
    padding: 10px; border-radius: var(--radius); border:1px solid #d4bf8c; text-align:center;
    box-shadow: var(--shadow); z-index: 5;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .action-bar .hint { font-size: 13px; color: var(--gold-deep); margin-bottom: 8px; }
  .bid-buttons { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .bid-buttons button { padding: 10px 14px; font-size: 15px; min-width: 48px; min-height: 44px; }

  /* 覆盖层 */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index: 100; padding: 20px; }
  .overlay .box { background: var(--paper); border-radius: 12px; padding: 20px; max-width: 400px; width: 100%; border: 2px solid var(--gold-deep); box-shadow: 0 10px 40px rgba(0,0,0,.4); max-height: 90vh; overflow-y:auto; }
  .overlay h2 { color: var(--gold-deep); margin-bottom: 12px; text-align:center; letter-spacing: 4px; }
  .overlay .msg { font-size: 14px; color:#5a4a2a; margin-bottom: 12px; line-height: 1.6; }
  .settle-table { width: 100%; border-collapse:collapse; font-size: 13px; }
  .settle-table th, .settle-table td { padding: 6px 4px; text-align:center; border-bottom:1px solid #e0d4b3; }
  .settle-table th { color: var(--gold-deep); }
  .settle-table td.plus { color: var(--green); font-weight:600; }
  .settle-table td.minus { color: var(--red); font-weight:600; }

  /* Toast */
  .toast { position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.85); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px;
    z-index: 200; box-shadow: 0 4px 20px rgba(0,0,0,.4);
    animation: toastIn .2s ease, toastOut .3s ease 1.6s forwards; pointer-events: none;
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -10px);} to { opacity: 1; transform: translate(-50%, 0);} }
  @keyframes toastOut { to { opacity: 0; } }

  .conn-badge {
    position: fixed; top: 6px; right: 8px; z-index: 90;
    font-size: 11px; padding: 3px 8px; border-radius: 12px;
    background: rgba(0,0,0,.6); color: #fff;
  }
  .conn-badge.ok { background: rgba(47,122,58,.85); }
  .conn-badge.bad { background: rgba(194,58,47,.85); }

  .room-code-big {
    font-size: 44px; font-weight: 700; letter-spacing: 12px;
    color: var(--red); text-align: center; padding: 12px 0;
    background: #fff; border-radius: 12px; border: 2px dashed var(--gold-deep);
    margin: 10px 0;
  }
  .rules-section { font-size: 13px; line-height: 1.7; color: #4a3a1e; }
  .rules-section h4 { color: var(--gold-deep); margin-top: 10px; margin-bottom: 4px; }
  .rules-section ul { padding-left: 20px; margin: 4px 0; }
  .footer-note { text-align: center; font-size: 11px; color:#a89268; margin: 20px 0; letter-spacing: 2px; }

  @media (max-width: 360px) {
    .card { width: 54px; height: 80px; }
    .card .num { font-size: 19px; }
    .card-header .title { font-size: 28px; letter-spacing: 6px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="conn" class="conn-badge">连接中…</div>

<script>
/* =====================================================
   财神大战 · 联机客户端
   ===================================================== */

const FACTIONS = {
  qinglong: { name: '青龙', short: '龙', icon: '🐉', color: 'var(--green)' },
  baihu:    { name: '白虎', short: '虎', icon: '🐯', color: 'var(--yellow)' },
  zhuque:   { name: '朱雀', short: '雀', icon: '🐦', color: 'var(--red)' },
  xuanwu:   { name: '玄武', short: '武', icon: '🐢', color: 'var(--blue)' },
};

// ---------- 状态 ----------
const S = {
  screen: 'home',      // home | lobby | create | join | game | rules
  ws: null,
  connected: false,
  myId: localStorage.getItem('caishen_myId') || null,
  myName: localStorage.getItem('caishen_myName') || '',
  roomCode: null,
  mySeat: null,
  view: null,          // 服务端下发的房间视图
  urlRoomCode: null,   // 从 URL 参数进入的房号
};

// 从 URL 参数带房号
(function parseUrl(){
  const p = new URLSearchParams(location.search);
  const r = p.get('r');
  if (r) S.urlRoomCode = r.toUpperCase();
})();

// ---------- WebSocket ----------
function wsUrl() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${proto}//${location.host}`;
}

function connectWS() {
  return new Promise((resolve, reject) => {
    if (S.ws && S.ws.readyState === 1) { resolve(); return; }
    const ws = new WebSocket(wsUrl());
    S.ws = ws;
    ws.onopen = () => { S.connected = true; setConnBadge(); resolve(); };
    ws.onclose = () => {
      S.connected = false; setConnBadge();
      // 3 秒后自动重连
      setTimeout(() => {
        if (!S.connected) connectWS().then(() => {
          // 如果之前在房间里，尝试用 myId 重连
          if (S.roomCode && S.myId) {
            wsSend({ type: 'join', room: S.roomCode, name: S.myName, myId: S.myId });
          }
        }).catch(()=>{});
      }, 2000);
    };
    ws.onerror = () => { /* 让 onclose 处理 */ };
    ws.onmessage = (ev) => {
      let msg; try { msg = JSON.parse(ev.data); } catch(e) { return; }
      handleMsg(msg);
    };
  });
}

function wsSend(obj) {
  if (S.ws && S.ws.readyState === 1) S.ws.send(JSON.stringify(obj));
  else toast('未连接服务器');
}

function setConnBadge() {
  const el = document.getElementById('conn');
  if (!el) return;
  if (S.connected) { el.textContent = '已连接'; el.className = 'conn-badge ok'; setTimeout(()=>{ el.style.display='none';}, 1200); }
  else { el.textContent = '断开·重连中'; el.className = 'conn-badge bad'; el.style.display=''; }
}

function handleMsg(msg) {
  if (msg.type === 'error') { toast(msg.msg); return; }
  if (msg.type === 'joined') {
    S.roomCode = msg.code;
    S.mySeat = msg.seat;
    S.myId = msg.myId;
    localStorage.setItem('caishen_myId', S.myId);
    if (msg.reconnect) toast('已重连');
    return;
  }
  if (msg.type === 'state') {
    S.view = msg.view;
    S.screen = 'game';
    render();
    return;
  }
  if (msg.type === 'heartbeat' || msg.type === 'pong') return;
}

// ---------- 工具 ----------
function toast(msg, dur=1800) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), dur);
}
function goto(s) { S.screen = s; render(); }
function render() { App(); }

// ============================================================
//                     UI
// ============================================================
function App() {
  const app = document.getElementById('app');
  if (S.screen === 'home')   return renderHome(app);
  if (S.screen === 'create') return renderCreate(app);
  if (S.screen === 'join')   return renderJoin(app);
  if (S.screen === 'rules')  return renderRules(app);
  if (S.screen === 'game')   return renderGame(app);
}

function renderHome(app) {
  const invited = S.urlRoomCode;
  app.innerHTML = `
    <div class="card-header">
      <div class="title">财神大战</div>
      <div class="slogan">押得准 · 赢金豆</div>
    </div>
    ${invited ? `
      <div class="panel" style="border-color: var(--red); background: #fff5f0;">
        <h3 style="color: var(--red);">🎉 你被邀请加入房间</h3>
        <div class="room-code-big">${invited}</div>
        <button style="width:100%;" onclick="quickJoin('${invited}')">直接加入</button>
      </div>
    ` : ''}
    <div class="panel">
      <h3>联机对战（推荐）</h3>
      <div style="font-size:13px; color:#5a4a2a; margin-bottom:12px; line-height:1.7;">
        3-6 人 · 各自手机操作 · 微信群发链接邀请
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button onclick="goto('create')">建 房</button>
        <button class="ghost" onclick="goto('join')">加入房间</button>
      </div>
    </div>
    <div class="panel">
      <h3>其他</h3>
      <div style="display:flex; gap:8px;">
        <button class="ghost" style="flex:1;" onclick="goto('rules')">看规则</button>
        <button class="ghost" style="flex:1;" onclick="shareLink()">复制邀请链接</button>
      </div>
    </div>
    <div class="footer-note">v0.5 · 联机版</div>
  `;
}

function renderCreate(app) {
  app.innerHTML = `
    <div class="card-header">
      <div class="title" style="font-size:22px; letter-spacing:6px;">建 房</div>
    </div>
    <div class="panel">
      <h3>你的昵称</h3>
      <div class="row">
        <input id="in-name" type="text" placeholder="给自己起个名字" value="${escapeHtml(S.myName)}" maxlength="12">
      </div>
      <div style="font-size:12px; color:#8a6a4a; margin-top:8px; line-height:1.6;">
        建房后你会拿到 4 位房间码，把链接分享到微信群即可邀请朋友
      </div>
    </div>
    <div class="row">
      <button class="ghost" style="flex:1;" onclick="goto('home')">返回</button>
      <button style="flex:2;" onclick="doCreate()">建 房</button>
    </div>
  `;
}

function renderJoin(app) {
  app.innerHTML = `
    <div class="card-header">
      <div class="title" style="font-size:22px; letter-spacing:6px;">加入房间</div>
    </div>
    <div class="panel">
      <h3>房间码</h3>
      <div class="row">
        <input id="in-room" type="text" placeholder="4 位房间码" maxlength="4" style="text-transform: uppercase;">
      </div>
      <h3 style="margin-top:12px;">你的昵称</h3>
      <div class="row">
        <input id="in-name" type="text" placeholder="给自己起个名字" value="${escapeHtml(S.myName)}" maxlength="12">
      </div>
    </div>
    <div class="row">
      <button class="ghost" style="flex:1;" onclick="goto('home')">返回</button>
      <button style="flex:2;" onclick="doJoin()">加 入</button>
    </div>
  `;
}

function renderRules(app) {
  app.innerHTML = `
    <div class="card-header">
      <div class="title" style="font-size:22px; letter-spacing:6px;">规则说明</div>
    </div>
    <div class="panel rules-section">
      <h4>一、牌组（共 60 张）</h4>
      <ul>
        <li><b>四阵营</b>：青龙 / 白虎 / 朱雀 / 玄武，各 13 张（1-13）</li>
        <li><b>财神 × 4</b>（最强，打出即赢当前把）</li>
        <li><b>穷鬼 × 4</b>（最弱，永不吃把）</li>
      </ul>
      <h4>二、牌型大小</h4>
      <div>财神 &gt; 当家牌 &gt; 同阵营大牌 &gt; 穷鬼</div>
      <div style="margin-top:4px; color:#8a6a1e;">同大小时 <b>先出的赢</b></div>
      <h4>三、每轮流程</h4>
      <ul>
        <li>第 N 轮每人发 N 张牌</li>
        <li>翻顶牌决定"当家"阵营</li>
        <li>押把：庄家左手开始，<b>公开依次押把</b>（后押的看得到前面）</li>
        <li>出牌：<b>本轮所有把都由同一位先出玩家开局</b>（首出=庄家左手）</li>
        <li>顺时针一人一张为一把，必须跟首出阵营（除非手上没有）</li>
      </ul>
      <h4>四、计分</h4>
      <ul>
        <li>押对：+20 金豆 + 每把 × 10 金豆</li>
        <li>押错：差几把扣几个 10 金豆</li>
      </ul>
    </div>
    <button class="ghost" style="width:100%;" onclick="goto('home')">返回</button>
  `;
}

function renderGame(app) {
  const v = S.view;
  if (!v) { app.innerHTML = '<div class="panel">加载中…</div>'; return; }
  document.querySelectorAll('.overlay').forEach(el => el.remove());

  // 等待开局
  if (v.state === 'waiting') return renderWaiting(app, v);

  const trumpDisp = v.trump && FACTIONS[v.trump]
    ? `<span class="trump-badge" style="color:${FACTIONS[v.trump].color};">${FACTIONS[v.trump].icon}${FACTIONS[v.trump].name}</span>`
    : `<span class="trump-badge">无当家</span>`;

  app.innerHTML = `
    <div class="top-bar">
      <div>
        <div class="round-info">第 ${v.round} / ${v.totalRounds} 轮</div>
        <div class="code-info">房间 ${v.code}</div>
      </div>
      <div class="trump-info">当家 ${trumpDisp}</div>
    </div>
    <div class="player-list">
      ${v.players.map(p => {
        const isYou = p.seat === S.mySeat;
        const isTurn = v.state === 'playing' && v.turnSeat === p.seat && v.pendingBidSeat >= v.players.length;
        const isBidding = v.state === 'playing' && v.pendingBidSeat < v.players.length && v.bidOrder[v.pendingBidSeat] === p.seat;
        return `
          <div class="player-card ${(isTurn||isBidding)?'active':''} ${isYou?'you':''} ${!p.connected?'offline':''}">
            <div class="name">
              ${escapeHtml(p.name)}
              ${p.isHost?'<span class="tag-host">房主</span>':''}
              ${p.seat===v.dealerSeat?'<span class="tag-dealer">庄</span>':''}
              ${p.seat===v.roundLeadSeat?'<span class="tag-lead">首出</span>':''}
              ${!p.connected?'<span class="tag-off">离线</span>':''}
            </div>
            <div class="stats">
              押：${v.bids[p.seat] != null ? `<b style="color:var(--red);">${v.bids[p.seat]}</b>` : '?'}
              · 吃：${v.wins[p.seat]}
              · 金豆：${v.scores[p.seat]}
            </div>
          </div>
        `;
      }).join('')}
    </div>
    <div class="trick-area">
      ${v.currentTrick.length === 0
        ? `<div class="empty">等待 <b style="color:var(--red);">${escapeHtml(v.players[v.roundLeadSeat]?.name || '')}</b> 出牌</div>`
        : v.currentTrick.map((p, idx) => `
          <div class="trick-play">
            <div class="who">${escapeHtml(v.players[p.seat].name)}${idx===0?' <span class="lead-mark">先</span>':''}</div>
            ${renderCardHTML(p.card, false, false)}
          </div>
        `).join('')}
    </div>
    ${renderMyHand(v)}
    ${renderActionBar(v)}
  `;

  if (v.state === 'roundend') renderRoundEndOverlay(v);
  if (v.state === 'gameend') renderGameEndOverlay(v);
}

function renderWaiting(app, v) {
  const isHost = v.players[S.mySeat]?.isHost;
  const shareUrl = `${location.origin}${location.pathname}?r=${v.code}`;
  app.innerHTML = `
    <div class="card-header">
      <div class="title" style="font-size:22px; letter-spacing:6px;">等待开局</div>
    </div>
    <div class="panel">
      <h3>房间码</h3>
      <div class="room-code-big">${v.code}</div>
      <div style="display:flex; gap:8px;">
        <button style="flex:1;" onclick="copyText('${v.code}')">复制房间码</button>
        <button class="ghost" style="flex:1;" onclick="copyText('${shareUrl}')">复制邀请链接</button>
      </div>
      <div style="font-size:12px; color:#8a6a4a; margin-top:10px; line-height:1.6;">
        把链接发到微信群 · 朋友点开就是这个房间<br>
        或让朋友在首页手动输入房间码
      </div>
    </div>
    <div class="panel">
      <h3>已到 ${v.players.length} / 6 人</h3>
      ${v.players.map(p => `
        <div style="display:flex; align-items:center; padding: 8px; border-bottom: 1px dashed #d4bf8c;">
          <div style="flex:1; font-weight:600;">
            ${escapeHtml(p.name)}
            ${p.isHost?'<span class="tag-host">房主</span>':''}
            ${p.seat===S.mySeat?' <span style="color:var(--red); font-size:11px;">（你）</span>':''}
          </div>
        </div>
      `).join('')}
    </div>
    <div class="panel">
      ${isHost ? `
        <button style="width:100%;" ${v.players.length<3?'disabled':''} onclick="wsSend({type:'start'})">
          ${v.players.length<3?`至少 3 人才能开局（还差 ${3-v.players.length} 人）`:'开始游戏'}
        </button>
      ` : `<div style="text-align:center; color:#8a6a1e; font-size:14px;">等待房主开局…</div>`}
    </div>
    <button class="ghost" style="width:100%;" onclick="leaveRoom()">离开房间</button>
  `;
}

function renderMyHand(v) {
  if (S.mySeat == null || !v.myHand) return '';
  const hand = v.myHand;
  const myTurn = v.pendingBidSeat >= v.players.length && v.turnSeat === S.mySeat;
  return `
    <div class="hand-area">
      <div class="hand-title">
        <span>你的手牌 · ${hand.length} 张</span>
        ${myTurn ? '<span style="color:var(--red);">轮到你出牌</span>' : ''}
      </div>
      <div class="hand-cards">
        ${hand.map((c, i) => {
          const legalCard = myTurn && isCardLegalClient(hand, i, v.currentTrick);
          const card = clientCardShape(c);
          return renderCardHTML(card, legalCard, true, `onclick="tryPlay(${i})"`);
        }).join('')}
      </div>
    </div>
  `;
}

function renderActionBar(v) {
  // 押把阶段
  if (v.pendingBidSeat < v.players.length) {
    const currentBidder = v.bidOrder[v.pendingBidSeat];
    if (currentBidder === S.mySeat) {
      const handSize = v.myHand.length;
      const options = [];
      for (let i=0; i<=handSize; i++) options.push(i);
      const alreadyBid = v.bidOrder.slice(0, v.pendingBidSeat)
        .map(seat => `${v.players[seat].name}:${v.bids[seat]}`).join(' · ');
      const priorInfo = alreadyBid ? `<div style="font-size:12px; color:#8a6a1e; margin-bottom:6px;">前面已押 → ${escapeHtml(alreadyBid)}</div>` : '';
      return `
        <div class="action-bar">
          ${priorInfo}
          <div class="hint">请押把：预测本轮能吃几把（0 - ${handSize}）</div>
          <div class="bid-buttons">
            ${options.map(b => `<button onclick="wsSend({type:'bid',bid:${b}})">${b}</button>`).join('')}
          </div>
        </div>
      `;
    } else {
      return `<div class="action-bar"><div class="hint">等待 ${escapeHtml(v.players[currentBidder].name)} 押把…</div></div>`;
    }
  }
  // 出牌阶段
  if (v.state === 'playing') {
    if (v.turnSeat === S.mySeat) return `<div class="action-bar"><div class="hint">轮到你出牌 · 点击手牌</div></div>`;
    return `<div class="action-bar"><div class="hint">等待 ${escapeHtml(v.players[v.turnSeat].name)} 出牌…</div></div>`;
  }
  return '';
}

function renderRoundEndOverlay(v) {
  const isHost = v.players[S.mySeat]?.isHost;
  const html = `
    <div class="overlay">
      <div class="box">
        <h2>本 轮 结 算</h2>
        <div class="msg">第 ${v.round} 轮 · 当家：${v.trump && FACTIONS[v.trump] ? FACTIONS[v.trump].name : '无'}</div>
        <table class="settle-table">
          <thead><tr><th>玩家</th><th>押</th><th>吃</th><th>金豆</th><th>总</th></tr></thead>
          <tbody>
          ${v.players.map(p => {
            const d = v.lastDeltas[p.seat];
            return `<tr>
              <td>${escapeHtml(p.name)}${p.seat===S.mySeat?' 👤':''}</td>
              <td>${v.bids[p.seat]}</td>
              <td>${v.wins[p.seat]}</td>
              <td class="${d>=0?'plus':'minus'}">${d>=0?'+':''}${d}</td>
              <td>${v.scores[p.seat]}</td>
            </tr>`;
          }).join('')}
          </tbody>
        </table>
        <div style="margin-top:16px; text-align:center;">
          ${isHost
            ? `<button onclick="wsSend({type:'next'})">${v.round >= v.totalRounds ? '看最终排行' : '下一轮'}</button>`
            : `<div style="color:#8a6a1e;">等待房主进入下一轮…</div>`}
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', html);
}

function renderGameEndOverlay(v) {
  const sorted = [...v.players].sort((a,b) => v.scores[b.seat] - v.scores[a.seat]);
  const html = `
    <div class="overlay">
      <div class="box">
        <h2>🏆 终 局 排 行</h2>
        <div class="msg" style="text-align:center;">冠军：<b style="color:var(--red);">${escapeHtml(sorted[0].name)}</b>（${v.scores[sorted[0].seat]} 金豆）</div>
        <table class="settle-table">
          <thead><tr><th>名次</th><th>玩家</th><th>金豆</th></tr></thead>
          <tbody>
          ${sorted.map((p, i) => `
            <tr><td>${i+1}</td><td>${escapeHtml(p.name)}${p.seat===S.mySeat?' 👤':''}</td><td>${v.scores[p.seat]}</td></tr>
          `).join('')}
          </tbody>
        </table>
        <div style="margin-top:16px;">
          <button style="width:100%;" onclick="leaveRoom()">返回首页</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', html);
}

// ---------- 客户端规则辅助（只用于 UI 提示，服务端才是权威）----------
function getLeadFactionClient(trick) {
  for (const p of trick) {
    if (p.card.t === 'caishen') return null;
    if (p.card.t === 'normal') return p.card.f;
  }
  return null;
}
function isCardLegalClient(hand, cardIdx, currentTrick) {
  const card = hand[cardIdx];
  if (!card) return false;
  if (card.t === 'caishen' || card.t === 'qionggui') return true;
  if (currentTrick.length === 0) return true;
  const lead = getLeadFactionClient(currentTrick);
  if (!lead) return true;
  const hasLead = hand.some(c => c.t === 'normal' && c.f === lead);
  if (!hasLead) return true;
  return card.t === 'normal' && card.f === lead;
}
function clientCardShape(c) {
  // 服务端下发字段是 t/f/n，UI 组件用 type/faction/num
  if (c.t === 'caishen') return { type: 'caishen' };
  if (c.t === 'qionggui') return { type: 'qionggui' };
  return { type: 'normal', faction: c.f, num: c.n };
}

function renderCardHTML(card, selectable, small, extra='') {
  const size = small ? 'small' : '';
  const sel = selectable ? 'selectable' : (small ? 'disabled' : '');
  if (card.type === 'back') return `<div class="card back ${size}"></div>`;
  if (card.type === 'caishen') return `<div class="card special-caishen ${size} ${sel}" ${extra}><div class="icon">💰</div><div class="faction">财神</div></div>`;
  if (card.type === 'qionggui') return `<div class="card special-qionggui ${size} ${sel}" ${extra}><div class="icon">🥢</div><div class="faction">穷鬼</div></div>`;
  const f = FACTIONS[card.faction];
  return `<div class="card faction-${card.faction} ${size} ${sel}" ${extra}><div class="num">${card.num}</div><div class="faction">${f.icon}${f.short}</div></div>`;
}

// ---------- 动作 ----------
async function ensureConn() {
  if (!S.connected) await connectWS();
}
async function doCreate() {
  const name = document.getElementById('in-name').value.trim();
  if (!name) { toast('请填写昵称'); return; }
  S.myName = name; localStorage.setItem('caishen_myName', name);
  await ensureConn();
  wsSend({ type: 'create', name });
}
async function doJoin() {
  const room = document.getElementById('in-room').value.trim().toUpperCase();
  const name = document.getElementById('in-name').value.trim();
  if (!room || room.length !== 4) { toast('请输入 4 位房间码'); return; }
  if (!name) { toast('请填写昵称'); return; }
  S.myName = name; localStorage.setItem('caishen_myName', name);
  await ensureConn();
  wsSend({ type: 'join', room, name });
}
async function quickJoin(code) {
  if (!S.myName) { S.urlRoomCode = code; goto('join'); return; }
  await ensureConn();
  wsSend({ type: 'join', room: code, name: S.myName });
}
function leaveRoom() {
  S.roomCode = null; S.mySeat = null; S.view = null; S.urlRoomCode = null;
  history.replaceState(null, '', location.pathname);
  try { S.ws.close(); } catch(e){}
  S.connected = false; setConnBadge();
  goto('home');
  setTimeout(() => connectWS(), 500);
}
function tryPlay(idx) {
  const v = S.view;
  if (!v || v.turnSeat !== S.mySeat) return;
  if (!isCardLegalClient(v.myHand, idx, v.currentTrick)) { toast('不能出：必须跟首出阵营'); return; }
  wsSend({ type: 'play', cardIdx: idx });
}

function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => toast('已复制'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch(e) { toast('请手动复制'); }
    ta.remove();
  }
}
function shareLink() {
  const url = location.origin + location.pathname;
  copyText(url);
}
function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- 启动 ----------
render();
connectWS().then(() => {
  // 若 URL 带有房号且已有昵称，直接尝试加入
  if (S.urlRoomCode && S.myName && S.myId) {
    wsSend({ type: 'join', room: S.urlRoomCode, name: S.myName, myId: S.myId });
  }
});

// 移动端体验
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !S.connected) connectWS();
});
let lastTouch = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
</script>
